name: Deploy to VPS

on:
  push:
    branches:
      - main   # Trigger deployment only when pushing to main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -e  # stop on first error
            echo "🔁 Starting deployment..."

            # Move into your project directory
            cd ${{ secrets.VPS_PATH }}/client

            # Fetch and replace with latest code from GitHub
            git fetch origin main
            git reset --hard origin/main

            # Move up to docker-compose root
            cd ${{ secrets.VPS_PATH }}

            echo "🧹 Cleaning old containers and images..."
            docker compose down --remove-orphans
            docker system prune -af

            echo "🏗️ Rebuilding and deploying containers..."
            docker compose build --no-cache
            docker compose up -d

            echo "✅ Deployment complete!"
          EOF
